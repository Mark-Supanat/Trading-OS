<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Chart Test (Trading OS)</title>
<style>
  :root{--bg:#0b0e13;--panel:#131820;--line:#222a36;--txt:#d6dce6;--mut:#7d8798;--acc:#3b82f6}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  #app{display:flex;flex-direction:column;height:100%}
  .top{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
  .top select,.top button{background:#1b2230;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;cursor:pointer}
  .top button.on{background:var(--acc);border-color:var(--acc);color:#fff}
  .sp{flex:1}
  #status{color:var(--mut);font-size:12px}
  .main{flex:1;display:flex;min-height:0}
  .tools{display:flex;flex-direction:column;gap:4px;padding:6px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto}
  .tools button{width:40px;height:40px;background:#1b2230;color:var(--txt);border:1px solid var(--line);border-radius:6px;cursor:pointer;font-size:11px;line-height:1.1;padding:2px}
  .tools button:active{background:var(--acc)}
  #chart{flex:1;min-width:0}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <select id="symbol">
      <option value="BTCUSDT">BTC (BTCUSDT)</option>
      <option value="ETHUSDT">ETH (ETHUSDT)</option>
    </select>
    <select id="tf">
      <option value="5m">M5</option>
      <option value="15m">M15</option>
      <option value="1h" selected>H1</option>
      <option value="4h">H4</option>
      <option value="1d">D1</option>
    </select>
    <button data-ind="MA">MA</button>
    <button data-ind="EMA">EMA</button>
    <button data-ind="BOLL">BOLL</button>
    <button data-ind="VOL" class="on">VOL</button>
    <button data-ind="STOCHRSI">StochRSI</button>
    <button data-ind="RSI">RSI</button>
    <button data-ind="MACD">MACD</button>
    <span class="sp"></span>
    <span id="status">กำลังโหลด...</span>
  </div>
  <div class="main">
    <div class="tools" id="tools"></div>
    <div id="chart"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/klinecharts@9/dist/umd/klinecharts.min.js"></script>
<script>
(function(){
  var statusEl = document.getElementById('status');
  function setStatus(t){ statusEl.textContent = t; }

  if (typeof klinecharts === 'undefined') { setStatus('โหลด KLineChart ไม่สำเร็จ (เช็คเน็ต)'); return; }

  // ---------- Custom indicator: Stochastic RSI (K, D) ----------
  function calcStochRSI(list, p) {
    var rsiLen = p[0], stochLen = p[1], kSmooth = p[2], dSmooth = p[3];
    var n = list.length, out = new Array(n);
    var i, rsi = new Array(n), avgG = 0, avgL = 0;
    for (i = 0; i < n; i++) { rsi[i] = null; out[i] = {}; }
    // Wilder RSI
    for (i = 1; i < n; i++) {
      var ch = list[i].close - list[i-1].close;
      var g = ch > 0 ? ch : 0, l = ch < 0 ? -ch : 0;
      if (i <= rsiLen) {
        avgG += g; avgL += l;
        if (i === rsiLen) {
          avgG /= rsiLen; avgL /= rsiLen;
          rsi[i] = avgL === 0 ? 100 : 100 - 100 / (1 + avgG / avgL);
        }
      } else {
        avgG = (avgG * (rsiLen - 1) + g) / rsiLen;
        avgL = (avgL * (rsiLen - 1) + l) / rsiLen;
        rsi[i] = avgL === 0 ? 100 : 100 - 100 / (1 + avgG / avgL);
      }
    }
    // Raw stochastic of RSI
    var raw = new Array(n);
    for (i = 0; i < n; i++) {
      raw[i] = null;
      if (i - stochLen + 1 < rsiLen) continue;
      var hi = -Infinity, lo = Infinity;
      for (var j = i - stochLen + 1; j <= i; j++) { if (rsi[j] > hi) hi = rsi[j]; if (rsi[j] < lo) lo = rsi[j]; }
      raw[i] = hi === lo ? 0 : (rsi[i] - lo) / (hi - lo) * 100;
    }
    function sma(src, len) {
      var res = new Array(n), s = 0, c = 0;
      for (var k = 0; k < n; k++) {
        res[k] = null;
        if (src[k] == null) continue;
        // window of last len non-null values must be contiguous
        var ok = k - len + 1 >= 0, sum = 0;
        if (ok) for (var m = k - len + 1; m <= k; m++) { if (src[m] == null) { ok = false; break; } sum += src[m]; }
        if (ok) res[k] = sum / len;
      }
      return res;
    }
    var K = sma(raw, kSmooth), D = sma(K, dSmooth);
    for (i = 0; i < n; i++) {
      if (K[i] != null) out[i].k = K[i];
      if (D[i] != null) out[i].d = D[i];
    }
    return out;
  }
  klinecharts.registerIndicator({
    name: 'STOCHRSI',
    shortName: 'StochRSI',
    calcParams: [14, 14, 3, 3],
    precision: 2,
    minValue: 0,
    maxValue: 100,
    figures: [
      { key: 'k', title: 'K: ', type: 'line' },
      { key: 'd', title: 'D: ', type: 'line' }
    ],
    calc: function (dataList, indicator) { return calcStochRSI(dataList, indicator.calcParams); }
  });

  // ---------- Chart ----------
  var chart = klinecharts.init('chart');
  chart.setStyles({
    grid: { horizontal: { color: '#1a212c' }, vertical: { color: '#1a212c' } },
    candle: {
      bar: { upColor: '#26a69a', downColor: '#ef5350', upBorderColor: '#26a69a', downBorderColor: '#ef5350', upWickColor: '#26a69a', downWickColor: '#ef5350' }
    }
  });
  chart.createIndicator('VOL', false, { id: 'pane_VOL', height: 80 });

  // ---------- Data (Binance public, no key) ----------
  var BASES = ['https://api.binance.com', 'https://data-api.binance.vision'];
  async function fetchKlines(symbol, tf) {
    var lastErr;
    for (var b = 0; b < BASES.length; b++) {
      try {
        var r = await fetch(BASES[b] + '/api/v3/klines?symbol=' + symbol + '&interval=' + tf + '&limit=1000');
        if (!r.ok) throw new Error('HTTP ' + r.status);
        var rows = await r.json();
        return rows.map(function (x) {
          return { timestamp: x[0], open: +x[1], high: +x[2], low: +x[3], close: +x[4], volume: +x[5] };
        });
      } catch (e) { lastErr = e; }
    }
    throw lastErr;
  }
  async function loadData() {
    var sym = document.getElementById('symbol').value, tf = document.getElementById('tf').value;
    setStatus('กำลังโหลด ' + sym + ' ' + tf + '...');
    try {
      var data = await fetchKlines(sym, tf);
      chart.applyNewData(data);
      setStatus(sym + ' · ' + tf + ' · ' + data.length + ' แท่ง (Binance)');
    } catch (e) {
      setStatus('โหลดข้อมูลไม่ได้: ' + e.message);
    }
  }
  document.getElementById('symbol').onchange = loadData;
  document.getElementById('tf').onchange = loadData;

  // ---------- Indicator toggles ----------
  var active = { VOL: true };
  document.querySelectorAll('[data-ind]').forEach(function (btn) {
    btn.onclick = function () {
      var name = btn.getAttribute('data-ind');
      var overlayOnMain = (name === 'MA' || name === 'EMA' || name === 'BOLL');
      var paneId = overlayOnMain ? 'candle_pane' : 'pane_' + name;
      if (active[name]) {
        chart.removeIndicator(paneId, name);
        active[name] = false; btn.classList.remove('on');
      } else {
        if (overlayOnMain) chart.createIndicator(name, true, { id: 'candle_pane' });
        else chart.createIndicator(name, false, { id: paneId, height: 100 });
        active[name] = true; btn.classList.add('on');
      }
    };
  });

  // ---------- Drawing tools ----------
  var TOOLS = [
    ['segment', 'เส้น\nตรง'],
    ['straightLine', 'เส้น\nยาว'],
    ['rayLine', 'Ray'],
    ['horizontalStraightLine', 'แนว\nนอน'],
    ['verticalStraightLine', 'แนว\nตั้ง'],
    ['parallelStraightLine', 'ขนาน'],
    ['priceChannelLine', 'Channel'],
    ['fibonacciLine', 'Fib'],
    ['rect', 'กรอบ'],
    ['simpleAnnotation', 'โน้ต']
  ];
  var toolsEl = document.getElementById('tools');
  TOOLS.forEach(function (t) {
    var b = document.createElement('button');
    b.textContent = t[1].replace('\n', ' ');
    b.title = t[0];
    b.onclick = function () { chart.createOverlay(t[0]); };
    toolsEl.appendChild(b);
  });
  var clr = document.createElement('button');
  clr.textContent = 'ลบ\nทั้งหมด'.replace('\n', ' ');
  clr.onclick = function () { if (confirm('ลบเส้นที่วาดทั้งหมด?')) chart.removeOverlay(); };
  toolsEl.appendChild(clr);

  window.addEventListener('resize', function () { chart.resize(); });
  loadData();
})();
</script>
</body>
</html>
