<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Chart Test (Trading OS)</title>
<style>
  :root{--bg:#0e111a;--panel:#131722;--line:#2a2e39;--txt:#d1d4dc;--mut:#787b86;--acc:#2962ff;--hov:#2a2e39;--up:#089981;--dn:#f23645}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--panel);color:var(--txt);font:13px -apple-system,BlinkMacSystemFont,"Trebuchet MS","Segoe UI",sans-serif;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100%}
  button{font:inherit;color:inherit}
  /* top bar */
  .top{display:flex;align-items:center;gap:2px;height:40px;padding:0 8px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap;flex:none}
  .tb{background:none;border:0;border-radius:4px;padding:6px 8px;cursor:pointer;color:var(--txt);display:inline-flex;align-items:center;gap:6px;height:30px}
  .tb:hover{background:var(--hov)}
  .tb.sel{color:var(--acc)}
  .sep{width:1px;height:20px;background:var(--line);margin:0 6px;flex:none}
  .symbtn{font-weight:700;font-size:14px}
  .sp{flex:1}
  #symsel{background:var(--hov);color:var(--txt);border:0;border-radius:4px;height:30px;padding:0 8px;font-weight:700;font-size:14px}
  /* main */
  .main{flex:1;display:flex;min-height:0}
  .tools{width:52px;flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto}
  .tools button{width:38px;height:38px;flex:none;background:none;border:0;border-radius:4px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#b2b5be}
  .tools button:hover{background:var(--hov);color:#fff}
  .tools button.on{color:var(--acc);background:#1e2a4a}
  .tools hr{width:30px;border:0;border-top:1px solid var(--line);margin:4px 0}
  .tools svg,.tb svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
  .tb svg{width:20px;height:20px}
  .center{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg)}
  #chart{flex:1;min-height:0}
  .bottom{height:30px;flex:none;display:flex;align-items:center;gap:4px;padding:0 10px;background:var(--panel);border-top:1px solid var(--line);color:var(--mut);font-size:12px}
  #clock{margin-left:auto}
  /* watchlist */
  .wl{width:300px;flex:none;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
  .wl h4{margin:0;padding:12px 14px;font-size:14px;font-weight:700;border-bottom:1px solid var(--line)}
  .wl .hd,.wl .row{display:grid;grid-template-columns:1fr 78px 68px;gap:4px;padding:7px 14px;align-items:center}
  .wl .hd{color:var(--mut);font-size:11px}
  .wl .row{cursor:pointer;font-size:13px}
  .wl .row:hover{background:var(--hov)}
  .wl .row.act{outline:1px solid #b2b5be;outline-offset:-2px;border-radius:4px}
  .wl .row.off{opacity:.45}
  .wl .num{text-align:right;font-variant-numeric:tabular-nums}
  .up{color:var(--up)}.dn{color:var(--dn)}
  .wl .note{padding:10px 14px;color:var(--mut);font-size:11px;line-height:1.5}
  @media (max-width:900px){.wl{display:none}}
  @media (max-width:600px){.tools{width:44px}.tools button{width:34px;height:34px}}
  /* modal */
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:10}
  #modal.show{display:flex}
  .dlg{background:#1e222d;border:1px solid var(--line);border-radius:8px;width:min(460px,94vw);max-height:90vh;overflow:auto}
  .dlg h3{margin:0;padding:14px 16px;font-size:16px;border-bottom:1px solid var(--line)}
  .irow{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid #252a36}
  .irow label{flex:1;font-weight:600}
  .irow small{display:block;color:var(--mut);font-weight:400;font-size:11px;margin-top:2px}
  .irow input[type=text]{width:130px;background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:4px;padding:6px 8px}
  .irow input[type=text]:focus{outline:1px solid var(--acc)}
  .dlg .ft{display:flex;gap:8px;justify-content:flex-end;padding:12px 16px}
  .btn{background:var(--acc);color:#fff;border:0;border-radius:4px;padding:8px 18px;cursor:pointer;font-weight:600}
  .btn.g{background:var(--hov)}
  input[type=color]{width:28px;height:28px;border:0;padding:0;background:none;cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <div class="top" id="top">
    <select id="symsel"></select>
    <span class="sep"></span>
    <span id="tfs"></span>
    <span class="sep"></span>
    <button class="tb" id="btnInd" title="อินดิเคเตอร์"><svg viewBox="0 0 24 24"><path d="M3 17l5-6 4 3 6-8 3 4"/></svg><span>อินดิเคเตอร์</span></button>
    <span class="sep"></span>
    <label class="tb" title="สีเส้นที่จะวาดใหม่" style="gap:6px">สี <input type="color" id="drawColor" value="#2962ff"></label>
    <span class="sp"></span>
    <span id="status" style="color:var(--mut);font-size:12px;padding:0 8px"></span>
  </div>
  <div class="main">
    <div class="tools" id="tools"></div>
    <div class="center">
      <div id="chart"></div>
      <div class="bottom"><span id="tzinfo">เวลา UTC+7</span><span id="clock"></span></div>
    </div>
    <div class="wl">
      <h4>Red list</h4>
      <div class="hd"><span>สัญลักษณ์</span><span class="num">ล่าสุด</span><span class="num">เปลี่ยนแปลง%</span></div>
      <div id="wlrows"></div>
      <div class="note">แถวที่จางคือยังไม่ได้ต่อแหล่งข้อมูล (ขั้นต่อไป) ตอนนี้ BTCUSDT ใช้ข้อมูลจริงจาก Binance</div>
    </div>
  </div>
</div>

<div id="modal"><div class="dlg">
  <h3>อินดิเคเตอร์</h3>
  <div id="indlist"></div>
  <div class="ft"><button class="btn g" id="indCancel">ยกเลิก</button><button class="btn" id="indOk">ตกลง</button></div>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/klinecharts@9/dist/umd/klinecharts.min.js"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  function setStatus(t){ $('status').textContent = t; }
  if (typeof klinecharts === 'undefined') { setStatus('โหลด KLineChart ไม่สำเร็จ (เช็คเน็ต)'); return; }
  function lsGet(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }
  function lsSet(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }

  // ================= Indicator math =================
  function smaArr(src, len) {
    var n = src.length, res = new Array(n);
    for (var k = 0; k < n; k++) {
      res[k] = null;
      if (k - len + 1 < 0) continue;
      var sum = 0, ok = true;
      for (var m = k - len + 1; m <= k; m++) { if (src[m] == null) { ok = false; break; } sum += src[m]; }
      if (ok) res[k] = sum / len;
    }
    return res;
  }
  // Classic Stochastic (TradingView "Stoch"): [%K length, %K smoothing, %D smoothing]
  function calcStoch(list, p) {
    var len = p[0], ks = p[1], ds = p[2], n = list.length, raw = new Array(n), out = new Array(n), i;
    for (i = 0; i < n; i++) {
      raw[i] = null; out[i] = {};
      if (i - len + 1 < 0) continue;
      var hi = -Infinity, lo = Infinity;
      for (var j = i - len + 1; j <= i; j++) { if (list[j].high > hi) hi = list[j].high; if (list[j].low < lo) lo = list[j].low; }
      raw[i] = hi === lo ? 0 : (list[i].close - lo) / (hi - lo) * 100;
    }
    var K = smaArr(raw, ks), D = smaArr(K, ds);
    for (i = 0; i < n; i++) { if (K[i] != null) out[i].k = K[i]; if (D[i] != null) out[i].d = D[i]; }
    return out;
  }
  // Stochastic RSI: [RSI len, Stoch len, K smooth, D smooth]
  function calcStochRSI(list, p) {
    var rsiLen = p[0], stochLen = p[1], ks = p[2], ds = p[3], n = list.length, out = new Array(n), rsi = new Array(n), avgG = 0, avgL = 0, i;
    for (i = 0; i < n; i++) { rsi[i] = null; out[i] = {}; }
    for (i = 1; i < n; i++) {
      var ch = list[i].close - list[i-1].close, g = ch > 0 ? ch : 0, l = ch < 0 ? -ch : 0;
      if (i <= rsiLen) {
        avgG += g; avgL += l;
        if (i === rsiLen) { avgG /= rsiLen; avgL /= rsiLen; rsi[i] = avgL === 0 ? 100 : 100 - 100 / (1 + avgG / avgL); }
      } else {
        avgG = (avgG * (rsiLen - 1) + g) / rsiLen; avgL = (avgL * (rsiLen - 1) + l) / rsiLen;
        rsi[i] = avgL === 0 ? 100 : 100 - 100 / (1 + avgG / avgL);
      }
    }
    var raw = new Array(n);
    for (i = 0; i < n; i++) {
      raw[i] = null;
      if (i - stochLen + 1 < rsiLen) continue;
      var hi = -Infinity, lo = Infinity;
      for (var j = i - stochLen + 1; j <= i; j++) { if (rsi[j] > hi) hi = rsi[j]; if (rsi[j] < lo) lo = rsi[j]; }
      raw[i] = hi === lo ? 0 : (rsi[i] - lo) / (hi - lo) * 100;
    }
    var K = smaArr(raw, ks), D = smaArr(K, ds);
    for (i = 0; i < n; i++) { if (K[i] != null) out[i].k = K[i]; if (D[i] != null) out[i].d = D[i]; }
    return out;
  }
  var kdFigs = [{ key: 'k', title: 'K: ', type: 'line' }, { key: 'd', title: 'D: ', type: 'line' }];
  klinecharts.registerIndicator({ name: 'STOCH', shortName: 'Stoch', calcParams: [9, 3, 3], precision: 2, minValue: 0, maxValue: 100, figures: kdFigs,
    calc: function (d, ind) { return calcStoch(d, ind.calcParams); } });
  klinecharts.registerIndicator({ name: 'STOCHRSI', shortName: 'StochRSI', calcParams: [14, 14, 3, 3], precision: 2, minValue: 0, maxValue: 100, figures: kdFigs,
    calc: function (d, ind) { return calcStochRSI(d, ind.calcParams); } });

  // ================= Indicator config =================
  // main = วาดทับกราฟราคา, pane = แยกหน้าต่างล่าง
  var IND = {
    EMA:      { label: 'EMA',      hint: 'ช่วง (คั่นด้วยเว้นวรรค/คอมมา) เช่น 20 50 100 200', main: true,  def: [20, 50, 100, 200], min: 1, max: 8 },
    MA:       { label: 'MA',       hint: 'ช่วง เช่น 5 10 20 60',                             main: true,  def: [5, 10, 20, 60],   min: 1, max: 8 },
    BOLL:     { label: 'Bollinger Bands', hint: 'ความยาว, ส่วนเบี่ยงเบน เช่น 20 2',          main: true,  def: [20, 2],           min: 2, max: 2 },
    VOL:      { label: 'ปริมาณ (Volume)', hint: 'เส้น MA ของวอลุ่ม เช่น 5 10 20',            main: false, def: [5, 10, 20],       min: 0, max: 4, h: 80 },
    RSI:      { label: 'RSI',      hint: 'ช่วง เช่น 14',                                      main: false, def: [14],              min: 1, max: 3, h: 100 },
    STOCH:    { label: 'Stoch',    hint: '%K, ปรับ %K, %D เช่น 9 3 3',                        main: false, def: [9, 3, 3],         min: 3, max: 3, h: 100 },
    STOCHRSI: { label: 'Stoch RSI',hint: 'RSI, Stoch, K, D เช่น 14 14 3 3',                   main: false, def: [14, 14, 3, 3],    min: 4, max: 4, h: 100 },
    MACD:     { label: 'MACD',     hint: 'เร็ว, ช้า, สัญญาณ เช่น 12 26 9',                    main: false, def: [12, 26, 9],       min: 3, max: 3, h: 100 }
  };
  var ORDER = ['EMA', 'MA', 'BOLL', 'VOL', 'RSI', 'STOCH', 'STOCHRSI', 'MACD'];
  var state = lsGet('ct_ind_v2');
  if (!state) {
    state = {};
    ORDER.forEach(function (k) { state[k] = { on: false, p: IND[k].def.slice() }; });
    ['EMA', 'VOL', 'RSI', 'STOCH'].forEach(function (k) { state[k].on = true; });
  }
  ORDER.forEach(function (k) { if (!state[k]) state[k] = { on: false, p: IND[k].def.slice() }; });

  // ================= Chart =================
  var chart = klinecharts.init('chart');
  chart.setTimezone('Asia/Bangkok');
  var UP = '#089981', DN = '#f23645';
  chart.setStyles({
    grid: { horizontal: { color: '#1b1f2b' }, vertical: { color: '#1b1f2b' } },
    candle: {
      bar: { upColor: UP, downColor: DN, upBorderColor: UP, downBorderColor: DN, upWickColor: UP, downWickColor: DN },
      priceMark: { last: { upColor: UP, downColor: DN } }
    },
    indicator: { bars: [{ upColor: 'rgba(8,153,129,.5)', downColor: 'rgba(242,54,69,.5)', noChangeColor: '#888' }] },
    xAxis: { axisLine: { color: '#2a2e39' }, tickLine: { color: '#2a2e39' } },
    yAxis: { axisLine: { color: '#2a2e39' }, tickLine: { color: '#2a2e39' } },
    separator: { color: '#2a2e39' }
  });

  function paneOf(k) { return IND[k].main ? 'candle_pane' : 'pane_' + k; }
  function removeInd(k) { try { chart.removeIndicator(paneOf(k), k); } catch (e) {} }
  function addInd(k) {
    var c = IND[k], create = { name: k, calcParams: state[k].p };
    if (c.main) chart.createIndicator(create, true, { id: 'candle_pane' });
    else chart.createIndicator(create, false, { id: 'pane_' + k, height: c.h || 100 });
  }
  function rebuildIndicators() {
    ORDER.forEach(removeInd);
    ORDER.forEach(function (k) { if (state[k].on) addInd(k); });
    lsSet('ct_ind_v2', state);
  }
  rebuildIndicators();

  // ================= Data (Binance public) =================
  var SYMS = [
    { id: 'DXY', src: null }, { id: 'US10Y', src: null }, { id: 'WTI', src: null },
    { id: 'XAUUSD', src: null }, { id: 'XAGUSD', src: null }, { id: 'BTCUSDT', src: 'binance', bn: 'BTCUSDT' },
    { id: 'NDX', src: null }, { id: 'SP500', src: null }, { id: 'USDJPY', src: null }, { id: 'USDTHB', src: null }
  ];
  var TFS = [['1m','1m'],['5m','5m'],['15m','15m'],['30m','30m'],['1h','1h'],['2h','2h'],['4h','4h'],['D','1d'],['W','1w'],['M','1M']];
  var cur = { sym: 'BTCUSDT', tf: '1h' };
  var BASES = ['https://api.binance.com', 'https://data-api.binance.vision'];
  async function bnGet(path) {
    var last;
    for (var b = 0; b < BASES.length; b++) {
      try { var r = await fetch(BASES[b] + path); if (!r.ok) throw new Error('HTTP ' + r.status); return await r.json(); } catch (e) { last = e; }
    }
    throw last;
  }
  async function loadData() {
    var s = SYMS.filter(function (x) { return x.id === cur.sym; })[0];
    if (!s || !s.src) { setStatus(cur.sym + ' ยังไม่ได้ต่อแหล่งข้อมูล'); return; }
    setStatus('กำลังโหลด...');
    try {
      var rows = await bnGet('/api/v3/klines?symbol=' + s.bn + '&interval=' + cur.tf + '&limit=1000');
      var data = rows.map(function (x) { return { timestamp: x[0], open: +x[1], high: +x[2], low: +x[3], close: +x[4], volume: +x[5] }; });
      chart.setPriceVolumePrecision(data.length && data[data.length-1].close < 10 ? 4 : 2, 2);
      chart.applyNewData(data);
      setStatus(cur.sym + ' · ' + cur.tf + ' · ' + data.length + ' แท่ง');
    } catch (e) { setStatus('โหลดข้อมูลไม่ได้: ' + e.message); }
  }

  // ---- top bar: symbol + timeframe
  var sel = $('symsel');
  SYMS.forEach(function (s) { var o = document.createElement('option'); o.value = s.id; o.textContent = s.id + (s.src ? '' : ' (ยังไม่มีข้อมูล)'); sel.appendChild(o); });
  sel.value = cur.sym;
  sel.onchange = function () { cur.sym = sel.value; markWL(); loadData(); };
  function renderTFs() {
    var box = $('tfs'); box.innerHTML = '';
    TFS.forEach(function (t) {
      var b = document.createElement('button'); b.className = 'tb' + (cur.tf === t[1] ? ' sel' : ''); b.textContent = t[0];
      b.onclick = function () { cur.tf = t[1]; renderTFs(); loadData(); };
      box.appendChild(b);
    });
  }
  renderTFs();

  // ---- watchlist
  var tick = {};
  function fmt(x) { return x == null ? '—' : x.toLocaleString('en-US', { maximumFractionDigits: x < 10 ? 4 : 2 }); }
  function renderWL() {
    var box = $('wlrows'); box.innerHTML = '';
    SYMS.forEach(function (s) {
      var d = document.createElement('div'); d.className = 'row' + (s.src ? '' : ' off') + (s.id === cur.sym ? ' act' : ''); d.dataset.id = s.id;
      var t = tick[s.id], pc = t ? t.pct : null;
      d.innerHTML = '<span>' + s.id + '</span><span class="num">' + fmt(t ? t.last : null) + '</span><span class="num ' + (pc == null ? '' : pc >= 0 ? 'up' : 'dn') + '">' + (pc == null ? '—' : (pc >= 0 ? '+' : '') + pc.toFixed(2) + '%') + '</span>';
      d.onclick = function () { if (!s.src) { setStatus(s.id + ' ยังไม่ได้ต่อแหล่งข้อมูล'); return; } cur.sym = s.id; sel.value = s.id; markWL(); loadData(); };
      box.appendChild(d);
    });
  }
  function markWL() { document.querySelectorAll('#wlrows .row').forEach(function (r) { r.classList.toggle('act', r.dataset.id === cur.sym); }); }
  async function refreshTicks() {
    for (var i = 0; i < SYMS.length; i++) {
      var s = SYMS[i]; if (s.src !== 'binance') continue;
      try { var j = await bnGet('/api/v3/ticker/24hr?symbol=' + s.bn); tick[s.id] = { last: +j.lastPrice, pct: +j.priceChangePercent }; } catch (e) {}
    }
    renderWL();
  }
  renderWL(); refreshTicks(); setInterval(refreshTicks, 15000);

  // ================= Drawing tools =================
  var P = {
    trend: '<circle cx="5" cy="19" r="1.6"/><circle cx="19" cy="5" r="1.6"/><path d="M6.2 17.8L17.8 6.2"/>',
    ray: '<circle cx="5" cy="19" r="1.6"/><path d="M6.2 17.8L21 3"/><path d="M15 3h6v6"/>',
    line: '<path d="M3 20L21 4"/>',
    hline: '<path d="M3 12h18"/><circle cx="12" cy="12" r="1.6"/>',
    vline: '<path d="M12 3v18"/><circle cx="12" cy="12" r="1.6"/>',
    para: '<path d="M4 9l16-5"/><path d="M4 20l16-5"/><path d="M4 9v11M20 4v11" stroke-dasharray="2 2"/>',
    chan: '<path d="M3 8l18-4"/><path d="M3 20l18-4"/><path d="M3 14l18-4" stroke-dasharray="2 2"/>',
    fib: '<path d="M3 5h18M3 10h18M3 15h18M3 20h18"/><path d="M6 20L18 5" stroke-dasharray="2 2"/>',
    rect: '<rect x="4" y="6" width="16" height="12" rx="1"/>',
    text: '<path d="M6 6h12M12 6v13M9 19h6"/>',
    note: '<path d="M5 5h14v10H11l-4 4v-4H5z"/>',
    magnet: '<path d="M6 3v8a6 6 0 0012 0V3h-4v8a2 2 0 01-4 0V3z"/><path d="M6 7h4M14 7h4"/>',
    lock: '<rect x="5" y="11" width="14" height="9" rx="1.5"/><path d="M8 11V8a4 4 0 018 0v3"/>',
    eye: '<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
    trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>'
  };
  function icon(k) { return '<svg viewBox="0 0 24 24">' + P[k] + '</svg>'; }
  var DRAW = [
    ['segment', 'trend', 'เส้นแนวโน้ม'], ['rayLine', 'ray', 'Ray'], ['straightLine', 'line', 'เส้นตรงยาว'],
    ['horizontalStraightLine', 'hline', 'เส้นแนวนอน'], ['verticalStraightLine', 'vline', 'เส้นแนวตั้ง'],
    ['parallelStraightLine', 'para', 'เส้นขนาน'], ['priceChannelLine', 'chan', 'Price Channel'],
    ['fibonacciLine', 'fib', 'Fibonacci Retracement'], ['rect', 'rect', 'สี่เหลี่ยม'], ['simpleAnnotation', 'note', 'โน้ต']
  ];
  var toolsEl = $('tools');
  var magnet = false, locked = false, hidden = false, selectedId = null;
  function mkBtn(k, title, fn) { var b = document.createElement('button'); b.title = title; b.innerHTML = icon(k); b.onclick = function () { fn(b); }; toolsEl.appendChild(b); return b; }
  function overlayStyles() {
    var c = $('drawColor').value;
    return { line: { color: c }, polygon: { color: c + '33', borderColor: c }, rect: { color: c + '33', borderColor: c }, text: { color: c, borderColor: c }, point: { color: c, borderColor: c, activeColor: c, activeBorderColor: c } };
  }
  DRAW.forEach(function (d) {
    mkBtn(d[1], d[2], function () {
      chart.createOverlay({
        name: d[0], lock: false, visible: true,
        mode: magnet ? 'weak_magnet' : 'normal',
        styles: overlayStyles(),
        onSelected: function (e) { selectedId = e.overlay.id; return false; },
        onDeselected: function () { selectedId = null; return false; }
      });
    });
  });
  toolsEl.appendChild(document.createElement('hr'));
  mkBtn('magnet', 'แม่เหล็ก (จับ High/Low/Close)', function (b) { magnet = !magnet; b.classList.toggle('on', magnet); });
  mkBtn('lock', 'ล็อกเส้นทั้งหมด', function (b) { locked = !locked; chart.overrideOverlay({ lock: locked }); b.classList.toggle('on', locked); });
  mkBtn('eye', 'ซ่อน/แสดงเส้นทั้งหมด', function (b) { hidden = !hidden; chart.overrideOverlay({ visible: !hidden }); b.classList.toggle('on', hidden); });
  mkBtn('trash', 'ลบเส้นทั้งหมด (เลือกเส้นแล้วกด Delete เพื่อลบทีละเส้น)', function () { if (confirm('ลบเส้นที่วาดทั้งหมด?')) chart.removeOverlay(); });
  document.addEventListener('keydown', function (e) {
    if ((e.key === 'Delete' || e.key === 'Backspace') && selectedId && !/INPUT|SELECT|TEXTAREA/.test((e.target.tagName || ''))) {
      chart.removeOverlay({ id: selectedId }); selectedId = null; e.preventDefault();
    }
  });

  // ================= Indicator dialog =================
  function openDlg() {
    var box = $('indlist'); box.innerHTML = '';
    ORDER.forEach(function (k) {
      var r = document.createElement('div'); r.className = 'irow';
      r.innerHTML = '<input type="checkbox" id="c_' + k + '"' + (state[k].on ? ' checked' : '') + '>' +
        '<label for="c_' + k + '">' + IND[k].label + '<small>' + IND[k].hint + '</small></label>' +
        '<input type="text" id="p_' + k + '" value="' + state[k].p.join(' ') + '">';
      box.appendChild(r);
    });
    $('modal').classList.add('show');
  }
  $('btnInd').onclick = openDlg;
  $('indCancel').onclick = function () { $('modal').classList.remove('show'); };
  $('modal').onclick = function (e) { if (e.target === $('modal')) $('modal').classList.remove('show'); };
  $('indOk').onclick = function () {
    var bad = [];
    ORDER.forEach(function (k) {
      var c = IND[k], nums = $('p_' + k).value.split(/[\s,]+/).filter(Boolean).map(Number);
      var ok = nums.every(function (x) { return isFinite(x) && x > 0; }) && nums.length >= c.min && nums.length <= c.max;
      if (!ok) { bad.push(c.label); nums = c.def.slice(); }
      state[k].p = nums.length ? nums : c.def.slice();
      state[k].on = $('c_' + k).checked;
    });
    if (bad.length) { alert('ค่าไม่ถูกต้อง ใช้ค่าเริ่มต้นแทนสำหรับ: ' + bad.join(', ')); }
    $('modal').classList.remove('show');
    rebuildIndicators();
  };

  // ================= misc =================
  function clock() {
    var d = new Date(Date.now() + 7 * 3600 * 1000);
    $('clock').textContent = d.toISOString().substr(11, 8) + ' UTC+7';
  }
  clock(); setInterval(clock, 1000);
  window.addEventListener('resize', function () { chart.resize(); });
  loadData();
})();
</script>
</body>
</html>
