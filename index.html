<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Action Plan — Weekly Forex</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f2f7;
  --bg2:#ffffff;
  --bg3:#f5f7fb;
  --bg4:#eaecf3;
  --border:#d8dce8;
  --border2:#b8bfd4;
  --text:#1a2035;
  --text2:#4a5578;
  --text3:#8a95b0;
  --gold:#c89a00;
  --gold-bg:#fff8e0;
  --gold-border:#e8d080;
  --gold2:#f5c430;
  --silver:#64748b;
  --green:#059669;
  --red:#dc2626;
  --blue:#2563eb;
  --purple:#7c3aed;
  --orange:#ea580c;
  --header-bg:rgba(255,255,255,.92);
  --font-display:'Bebas Neue',sans-serif;
  --font-mono:'DM Mono',monospace;
  --font-body:'DM Sans',sans-serif;
}
[data-theme="dark"]{
  --bg:#080a0f;
  --bg2:#0e1117;
  --bg3:#13171f;
  --bg4:#1a1f2b;
  --border:#1e2535;
  --border2:#2a3348;
  --text:#dde3f0;
  --text2:#7b88a8;
  --text3:#3d4d6a;
  --gold:#f0b429;
  --gold-bg:#1a1200;
  --gold-border:#5a4200;
  --gold2:#ffd166;
  --header-bg:rgba(8,10,15,.92);
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);min-height:100vh}

/* BG TEXTURE */
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 10% 10%,rgba(37,99,235,.04) 0%,transparent 55%),radial-gradient(ellipse at 90% 90%,rgba(124,58,237,.04) 0%,transparent 55%);pointer-events:none;z-index:0}

/* HEADER */
.header{position:sticky;top:0;z-index:100;background:var(--header-bg);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 6px rgba(0,0,0,.06)}
.logo{font-family:var(--font-display);font-size:20px;letter-spacing:.12em;color:var(--text)}
.logo span{color:var(--gold)}
.week-badge{font-family:var(--font-mono);font-size:11px;color:var(--text2);background:var(--bg3);border:1px solid var(--border2);padding:4px 12px;border-radius:6px;cursor:pointer;transition:all .2s}
.week-badge:hover{border-color:var(--gold);color:var(--gold)}
.header-right{display:flex;gap:8px;align-items:center}
.btn-save{padding:5px 14px;background:var(--gold);color:#fff;font-size:11px;font-weight:600;font-family:var(--font-mono);border:none;border-radius:6px;cursor:pointer;letter-spacing:.06em;transition:all .2s}
.btn-save:hover{background:#b08800}
.btn-reset{padding:5px 14px;background:transparent;color:#dc2626;font-size:11px;font-family:var(--font-mono);border:1px solid #dc262640;border-radius:6px;cursor:pointer;transition:all .2s;font-weight:600}
.btn-reset:hover{background:#fee2e2;border-color:#dc2626;color:#991b1b}
[data-theme="dark"] .btn-reset:hover{background:#450a0a;border-color:#f87171;color:#f87171}
.btn-new{padding:5px 14px;background:transparent;color:var(--text2);font-size:11px;font-family:var(--font-mono);border:1px solid var(--border2);border-radius:6px;cursor:pointer;transition:all .2s}
.btn-new:hover{border-color:var(--text2);color:var(--text)}

/* WEEK SELECTOR */
.week-bar{padding:12px 24px;border-bottom:1px solid var(--border);background:var(--bg2);display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;align-items:center}
.week-bar::-webkit-scrollbar{display:none}
.week-pill{padding:4px 14px;border-radius:20px;font-size:11px;font-family:var(--font-mono);border:1px solid var(--border2);background:transparent;color:var(--text3);cursor:pointer;white-space:nowrap;transition:all .2s}
.week-pill.active{background:var(--gold);color:#fff;border-color:var(--gold);font-weight:600}
.week-pill:hover:not(.active){border-color:var(--text3);color:var(--text2)}
.week-bar label{font-size:10px;color:var(--text3);font-family:var(--font-mono);white-space:nowrap;margin-right:4px}

/* MAIN LAYOUT */
.main{position:relative;z-index:1;padding:20px 24px;max-width:1400px;margin:0 auto}

/* MARKET OVERVIEW CARD */
.overview-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:20px 24px;margin-bottom:20px;position:relative;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.overview-card::before{content:'OVERVIEW';position:absolute;right:20px;top:14px;font-family:var(--font-display);font-size:72px;color:rgba(0,0,0,.04);line-height:1;pointer-events:none}
.section-tag{font-family:var(--font-display);font-size:11px;letter-spacing:.2em;color:var(--gold);margin-bottom:10px}
.overview-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.overview-field label{font-size:11px;color:var(--text);font-family:var(--font-mono);letter-spacing:.08em;font-weight:700;display:block;margin-bottom:5px}

/* Colored overview field wrappers - label color only */
.ov-box{border-radius:10px;padding:0}
.ov-box-week label{color:#b45309}
.ov-box-week .field-input{color:var(--text)}
.ov-box-risk label{color:#be123c}
.ov-box-risk .field-input{color:var(--text)}
.ov-box-cal label{color:#047857}
.ov-box-analysis label{color:#1d4ed8}
.ov-box-analysis .field-input{color:var(--text)}

[data-theme="dark"] .ov-box-week label{color:#fbbf24}
[data-theme="dark"] .ov-box-risk label{color:#fb7185}
[data-theme="dark"] .ov-box-cal label{color:#34d399}
[data-theme="dark"] .ov-box-analysis label{color:#60a5fa}

.field-input{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:var(--font-body);font-size:13px;padding:8px 12px;border-radius:8px;outline:none;transition:border-color .2s;resize:none}
.field-input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,154,0,.12)}
.field-input::placeholder{color:var(--text3)}
textarea.field-input{min-height:80px;line-height:1.6}

/* DXY BIAS BAR */
.dxy-bar{display:flex;align-items:center;gap:12px;margin-top:14px;padding:12px 16px;background:var(--bg3);border-radius:10px;border:1px solid var(--border)}
.dxy-label{font-family:var(--font-mono);font-size:12px;color:var(--text);letter-spacing:.08em;font-weight:700}
.bias-pills{display:flex;gap:6px}
.bias-pill{padding:3px 12px;border-radius:4px;font-size:11px;font-family:var(--font-mono);border:1px solid var(--border2);background:var(--bg2);color:var(--text2);cursor:pointer;transition:all .15s;font-weight:500}
.bias-pill.selected-LONG{background:#d1fae5;color:#065f46;border-color:#6ee7b7}
.bias-pill.selected-SHORT{background:#fee2e2;color:#991b1b;border-color:#fca5a5}
.bias-pill.selected-NEUTRAL{background:#ede9fe;color:#5b21b6;border-color:#c4b5fd}
.bias-pill.selected-WAIT{background:#f1f5f9;color:#475569;border-color:#94a3b8}
.bias-pill:hover:not([class*="selected"]){color:var(--text);border-color:var(--text3)}

/* SYMBOLS GRID */
.symbols-grid{display:grid;grid-template-columns:1fr;gap:14px}

/* SYMBOL CARD */
.sym-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:border-color .2s,box-shadow .2s,opacity .2s,transform .15s;box-shadow:0 2px 6px rgba(0,0,0,.04);cursor:default;user-select:none}
.sym-card:hover{border-color:var(--border2);box-shadow:0 4px 14px rgba(0,0,0,.08)}
.sym-card.dragging{opacity:.45;transform:scale(.99);box-shadow:0 8px 24px rgba(0,0,0,.18)}
.sym-card.drag-over{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.sym-header{padding:12px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:var(--bg3);gap:10px;flex-wrap:wrap}
.sym-name{font-family:var(--font-display);font-size:22px;letter-spacing:.08em}
.sym-tf{font-family:var(--font-mono);font-size:10px;color:var(--text3);background:var(--bg2);padding:2px 8px;border-radius:4px;border:1px solid var(--border)}
.sym-body{padding:14px 18px;display:flex;flex-direction:column;gap:10px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field-group label{font-size:11px;color:var(--text);font-family:var(--font-mono);letter-spacing:.08em;font-weight:700;display:block;margin-bottom:5px;text-transform:uppercase}
.field-sm{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:var(--font-body);font-size:13px;padding:7px 10px;border-radius:7px;outline:none;transition:border-color .2s}
.field-sm:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(200,154,0,.1)}
.field-sm::placeholder{color:var(--text3);font-size:11px}
select.field-sm{cursor:pointer}
select.field-sm option{background:var(--bg2);color:var(--text)}

/* DRAG HANDLE */
.drag-handle{cursor:grab;color:var(--text3);font-size:16px;padding:2px 6px;border-radius:4px;line-height:1;user-select:none;transition:color .15s}
.drag-handle:hover{color:var(--text2)}
.drag-handle:active{cursor:grabbing}
.bias-display{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:4px;font-family:var(--font-mono);font-size:11px;font-weight:600}
.bias-LONG{background:#d1fae5;color:#065f46;border:1px solid #6ee7b7}
.bias-SHORT{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
.bias-NEUTRAL{background:#ede9fe;color:#5b21b6;border:1px solid #c4b5fd}
.bias-WAIT{background:#f1f5f9;color:#475569;border:1px solid #94a3b8}

/* TF SELECTOR */
.tf-selector{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end}
.tf-pill{padding:2px 8px;border-radius:4px;font-size:11px;font-family:var(--font-mono);border:1px solid var(--border2);background:var(--bg2);color:var(--text2);cursor:pointer;transition:all .15s;font-weight:600;white-space:nowrap;letter-spacing:.04em}
.tf-pill:hover:not(.tf-active){color:var(--text2);border-color:var(--text3)}
.tf-pill.tf-active{background:var(--gold);color:#fff;border-color:var(--gold);font-weight:700}
[data-theme="dark"] .tf-pill.tf-active{color:#000}

/* SYMBOL COLORS */
.sym-xau .sym-name{color:#b45309}
.sym-xag .sym-name{color:#475569}
.sym-btc .sym-name{color:#c2410c}
.sym-jpy .sym-name{color:#047857}
.sym-eur .sym-name{color:#1d4ed8}
.sym-gbp .sym-name{color:#6d28d9}
.sym-s50 .sym-name{color:#be185d}
.sym-oil .sym-name{color:#3f6212}

.sym-xau{border-left:3px solid #f59e0b}
.sym-xag{border-left:3px solid #94a3b8}
.sym-btc{border-left:3px solid #f97316}
.sym-jpy{border-left:3px solid #10b981}
.sym-eur{border-left:3px solid #3b82f6}
.sym-gbp{border-left:3px solid #8b5cf6}
.sym-s50{border-left:3px solid #ec4899}
.sym-oil{border-left:3px solid #84cc16}

/* ============================================
   CHART IMAGE UPLOAD (NEW)
   ============================================ */
.chart-section{background:var(--bg3);border-radius:8px;padding:10px 12px;border:1px solid var(--border)}
.chart-section-label{font-size:11px;color:var(--text);font-family:var(--font-mono);letter-spacing:.08em;display:block;margin-bottom:7px;text-transform:uppercase;font-weight:700}

/* ECONOMIC CALENDAR DROP ZONE */
.cal-dropzone{position:relative;border:2px dashed var(--border2);border-radius:8px;background:var(--bg2);text-align:center;padding:14px 12px;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.cal-dropzone:hover,.cal-dropzone.dragover{border-color:var(--gold);background:var(--gold-bg)}
.cal-dropzone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.cal-img-wrap{display:none;border-radius:8px;overflow:hidden;border:1px solid var(--border);margin-top:8px}
.cal-img-wrap.show{display:block}
.cal-img-wrap img{width:100%;display:block;max-height:280px;object-fit:contain;background:#fff;cursor:zoom-in}
.cal-img-wrap img:hover{opacity:.95}

/* Drop Zone */
.chart-dropzone{position:relative;border:2px dashed var(--border2);border-radius:8px;background:var(--bg2);text-align:center;padding:16px 12px;cursor:pointer;transition:all .2s;min-height:72px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.chart-dropzone:hover,.chart-dropzone.dragover{border-color:var(--gold);background:var(--gold-bg)}
.chart-dropzone input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.chart-dropzone-icon{font-size:20px;line-height:1}
.chart-dropzone-text{font-size:11px;color:var(--text2);font-family:var(--font-mono)}
.chart-dropzone-hint{font-size:10px;color:var(--text3);font-family:var(--font-mono)}

/* Image Preview */
.chart-img-wrap{display:none;position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--border);margin-top:0}
.chart-img-wrap.show{display:block}
.chart-img-wrap img{width:100%;display:block;max-height:420px;object-fit:contain;background:#111;cursor:zoom-in}
.chart-img-wrap img:hover{opacity:.95}
.chart-img-actions{display:flex;gap:6px;padding:7px 8px;background:var(--bg3);border-top:1px solid var(--border);align-items:center}
.chart-img-btn{padding:3px 10px;background:var(--bg2);border:1px solid var(--border2);color:var(--text2);font-size:10px;font-family:var(--font-mono);border-radius:5px;cursor:pointer;transition:all .15s}
.chart-img-btn:hover{color:var(--text);border-color:var(--text3)}
.chart-img-btn.danger:hover{color:var(--red);border-color:var(--red)}
.chart-paste-hint{font-size:10px;color:var(--text3);font-family:var(--font-mono);margin-left:auto}

/* Dark theme overrides for bias pills */
[data-theme="dark"] .bias-pill.selected-LONG{background:#052e16;color:#4ade80;border-color:#16a34a55}
[data-theme="dark"] .bias-pill.selected-SHORT{background:#450a0a;color:#f87171;border-color:#b91c1c55}
[data-theme="dark"] .bias-pill.selected-NEUTRAL{background:#1e1b4b;color:#818cf8;border-color:#4338ca55}
[data-theme="dark"] .bias-pill.selected-WAIT{background:#1c1917;color:#a8a29e;border-color:#57534e55}
[data-theme="dark"] .bias-LONG{background:#052e1644;color:#4ade80;border:1px solid #16a34a55}
[data-theme="dark"] .bias-SHORT{background:#450a0a44;color:#f87171;border:1px solid #b91c1c55}
[data-theme="dark"] .bias-NEUTRAL{background:#1e1b4b44;color:#818cf8;border:1px solid #4338ca55}
[data-theme="dark"] .bias-WAIT{background:#1c191744;color:#a8a29e;border:1px solid #57534e55}
[data-theme="dark"] .toast{background:#14532d;color:#4ade80;border-color:#16a34a55}

/* NDX SYMBOL COLORS */
.sym-ndx .sym-name{color:#0e7490}
.sym-ndx{border-left:3px solid #06b6d4}

/* THEME TOGGLE BUTTON */
.btn-theme{padding:5px 10px;background:transparent;color:var(--text2);font-size:14px;font-family:var(--font-mono);border:1px solid var(--border2);border-radius:6px;cursor:pointer;transition:all .2s;line-height:1}
.btn-theme:hover{border-color:var(--gold);color:var(--gold)}
.note-field{width:100%;background:var(--bg2);border:2px solid var(--border2);color:var(--text);font-family:var(--font-body);font-size:13.5px;padding:10px 12px;border-radius:8px;outline:none;resize:vertical;min-height:90px;line-height:1.75;transition:border-color .2s,box-shadow .2s;font-weight:400}
.note-field:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(200,154,0,.15);background:var(--bg2)}
.note-field::placeholder{color:var(--text3);font-size:12px;font-style:italic}
[data-theme="dark"] .note-field{background:#0a0d14;border-color:#2a3348}

/* DAY TABS */
.day-tabs{display:flex;gap:3px;flex-wrap:wrap}
.day-tab{padding:3px 9px;border-radius:4px;font-size:11px;font-family:var(--font-mono);border:1px solid var(--border2);background:var(--bg2);color:var(--text2);cursor:pointer;transition:all .15s;font-weight:600;position:relative;white-space:nowrap;letter-spacing:.04em}
.day-tab:hover:not(.day-active){color:var(--text2);border-color:var(--text3)}
.day-tab.day-active{background:var(--gold);color:#fff;border-color:var(--gold);font-weight:700}
[data-theme="dark"] .day-tab.day-active{color:#000}
.day-tab:first-child{border-color:var(--blue,#2563eb);color:var(--blue,#2563eb)}
.day-tab:first-child.day-active{background:var(--blue,#2563eb);border-color:var(--blue,#2563eb);color:#fff}
.day-tab.has-img::after{content:'';position:absolute;top:2px;right:2px;width:5px;height:5px;border-radius:50%;background:#10b981}
.day-content{display:none}
.day-content.day-visible{display:flex;flex-direction:column;gap:6px}
.day-note{width:100%;background:var(--bg2);border:1.5px solid var(--border2);color:var(--text);font-family:var(--font-body);font-size:14px;padding:10px 12px;border-radius:7px;outline:none;resize:vertical;min-height:52px;line-height:1.8;transition:border-color .2s;font-weight:400}
.day-note:focus{border-color:var(--gold);box-shadow:0 0 0 2px rgba(200,154,0,.1)}
.day-note::placeholder{color:var(--text3);font-size:13px;font-style:italic}
[data-theme="dark"] .day-note{background:#0a0d14;border-color:#2a3348}

/* SUMMARY CARD */
.summary-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:20px 24px;margin-top:20px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;margin-top:12px}
.summary-item{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px 14px;display:flex;flex-direction:column;gap:4px}
.summary-sym{font-family:var(--font-display);font-size:15px;letter-spacing:.08em}
.summary-bias{font-family:var(--font-mono);font-size:11px}
.summary-strat{font-size:10px;color:var(--text2);font-family:var(--font-mono)}

/* TOAST */
.toast{position:fixed;bottom:20px;right:20px;padding:10px 16px;border-radius:8px;font-size:12px;font-family:var(--font-mono);z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none;background:#d1fae5;color:#065f46;border:1px solid #6ee7b7;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.toast.show{opacity:1}

/* PRINT STYLES */
@media print{
  .header,.week-bar,.btn-save,.btn-new,.chart-dropzone,.chart-img-actions{display:none!important}
  body{background:#fff;color:#000}
  .overview-card,.sym-card,.summary-card{box-shadow:none;border:1px solid #ccc}
}

@media(max-width:600px){
  .overview-grid,.field-row{grid-template-columns:1fr}
  .main{padding:14px}
}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- HEADER -->
<div class="header">
  <div class="logo">ACTION <span>PLAN</span></div>
  <div class="header-right">
    <button class="btn-theme" id="themeToggle" onclick="toggleTheme()" title="สลับธีม">🌙</button>
    <button class="btn-reset" onclick="confirmReset()" title="ล้างข้อมูลทั้งหมด">🗑 Reset</button>
    <button class="btn-new" onclick="exportData()">📋 Export</button>
    <button class="btn-save" onclick="saveData()">💾 SAVE</button>
  </div>
</div>

<!-- MAIN -->
<div class="main">

  <!-- MARKET OVERVIEW -->
  <div class="overview-card">
    <div class="section-tag">MARKET OVERVIEW</div>
    <div class="overview-grid">
      <div class="overview-field ov-box ov-box-week">
        <label>📅 WEEK RANGE</label>
        <input class="field-input" id="ov_week" placeholder="e.g. 18-22 MAY 2026" oninput="autoSave()">
      </div>
      <div class="overview-field ov-box ov-box-risk">
        <label>⚠️ KEY RISK / EVENT THIS WEEK</label>
        <input class="field-input" id="ov_risk" placeholder="e.g. CPI, FED, NFP..." oninput="autoSave()">
      </div>
    </div>
    <!-- ECONOMIC CALENDAR IMAGE -->
    <div style="margin-top:12px">
      <div class="overview-field ov-box ov-box-cal">
        <label>🗓 ECONOMIC CALENDAR THIS WEEK</label>
        <div class="cal-dropzone" id="cal_dropzone"
          ondragover="onCalDragOver(event)"
          ondragleave="onCalDragLeave(event)"
          ondrop="onCalDrop(event)">
          <input type="file" accept="image/*" onchange="onCalFileSelect(event)">
          <div class="chart-dropzone-icon">📅</div>
          <div class="chart-dropzone-text">คลิกเลือกรูป Economic Calendar หรือลากมาวาง</div>
          <div class="chart-dropzone-hint">Ctrl+V วางจาก screenshot ได้ทันที (คลิกที่นี่ก่อน)</div>
        </div>
        <div class="cal-img-wrap" id="cal_img_wrap">
          <img id="cal_img" src="" alt="Economic Calendar" onclick="openCalFullscreen()" title="คลิกดูเต็มจอ">
          <div class="chart-img-actions">
            <button class="chart-img-btn" onclick="openCalFullscreen()">🔍 ดูเต็มจอ</button>
            <button class="chart-img-btn danger" onclick="removeCalImage()">🗑 ลบรูป</button>
            <span class="chart-paste-hint">Ctrl+V แปะรูปใหม่</span>
          </div>
        </div>
      </div>
    </div>

    <div style="margin-top:12px">
      <div class="overview-field ov-box ov-box-analysis">
        <label>📊 MARKET ANALYSIS (DXY / OVERALL BIAS)</label>
        <textarea class="field-input" id="ov_analysis" placeholder="วิเคราะห์ภาพรวม อิง DXY เป็นหลัก..." rows="3" oninput="autoSave()"></textarea>
      </div>
    </div>
    <div class="dxy-bar">
      <span class="dxy-label">DXY BIAS:</span>
      <div class="bias-pills">
        <button class="bias-pill" onclick="setBias('dxy','LONG',this)">LONG</button>
        <button class="bias-pill" onclick="setBias('dxy','SHORT',this)">SHORT</button>
        <button class="bias-pill" onclick="setBias('dxy','NEUTRAL',this)">NEUTRAL</button>
        <button class="bias-pill" onclick="setBias('dxy','WAIT',this)">WAIT & SEE</button>
      </div>
      <span id="dxy_bias_display" style="margin-left:8px"></span>
    </div>
  </div>

  <!-- SYMBOLS GRID -->
  <div class="symbols-grid" id="symbolsGrid"></div>

  <!-- SUMMARY -->
  <div class="summary-card">
    <div class="section-tag">WEEKLY SUMMARY</div>
    <div class="summary-grid" id="summaryGrid"></div>
    <div style="margin-top:14px">
      <div class="overview-field">
        <label style="font-size:11px;color:var(--text);font-family:var(--font-mono);letter-spacing:.08em;font-weight:700;display:block;margin-bottom:6px">TRADE PLAN NOTE</label>
        <textarea class="field-input" id="ov_summary" placeholder="สรุปแผนการเทรด สัปดาห์นี้จะ Focus คู่ไหน Strategy อะไร..." rows="3" oninput="autoSave()"></textarea>
      </div>
    </div>
  </div>

</div>

<script>
// ============================================
// SYMBOLS CONFIG
// ============================================
const SYMBOLS = [
  {id:'xagusd', name:'XAGUSD', tf:'H4 — H1', cls:'sym-xag'},
  {id:'xauusd', name:'XAUUSD', tf:'H4 — H1', cls:'sym-xau'},
  {id:'btcusdt', name:'BTCUSDT', tf:'Day — H4', cls:'sym-btc'},
  {id:'usdjpy', name:'USDJPY', tf:'Day — H4', cls:'sym-jpy'},
  {id:'eurusd', name:'EURUSD', tf:'Day — H4', cls:'sym-eur'},
  {id:'gbpusd', name:'GBPUSD', tf:'H4 — H1', cls:'sym-gbp'},
  {id:'s50', name:'S50', tf:'H1', cls:'sym-s50'},
  {id:'usoil', name:'USOIL', tf:'H4', cls:'sym-oil'},
  {id:'ndx', name:'NDX', tf:'Day — H4', cls:'sym-ndx'},
];

const PATTERNS = ['Uptrend','Downtrend','Sideway Up','Sideway Down','Sideway','Breakout','Reversal','Consolidation','Pullback','Throwback','RBS','SBR','Other'];
const STRATEGIES = ['BUY The Dip','SELL The Rally','Aggressive','Defensive','Conservative','Wait and See','Breakout Play','Reversal Play','Follow Trend'];
const BIASES = ['LONG','SHORT','NEUTRAL','WAIT'];

// ============================================
// STATE
// ============================================
let currentWeek = '';
let allData = {};
let biasState = {};
let tfState = {};
let activeDayState = {}; // activeDayState[symId] = 'MON'|'TUE'|...
let autoSaveTimer;
let chartImages = {};

// ============================================
// INIT
// ============================================
window.onload = function() {
  const saved = localStorage.getItem('forex_action_plan');
  if (saved) allData = JSON.parse(saved);

  const savedImgs = localStorage.getItem('forex_action_plan_imgs');
  if (savedImgs) chartImages = JSON.parse(savedImgs);

  // โหลด theme preference
  const savedTheme = localStorage.getItem('forex_theme') || 'light';
  applyTheme(savedTheme);

  // โหลด symbol order
  const savedOrder = localStorage.getItem('forex_sym_order');
  if (savedOrder) {
    try {
      const order = JSON.parse(savedOrder);
      SYMBOLS.sort((a, b) => {
        const ai = order.indexOf(a.id), bi = order.indexOf(b.id);
        return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
      });
    } catch(e) {}
  }

  const weeks = Object.keys(allData);
  if (weeks.length === 0) {
    currentWeek = getThisWeekLabel();
    allData[currentWeek] = {};
  } else {
    currentWeek = weeks[weeks.length - 1];
  }

  renderSymbols();
  loadWeekData();

  // Global paste listener (Ctrl+V รูป)
  document.addEventListener('paste', handleGlobalPaste);
};

// ============================================
// THEME
// ============================================
let currentTheme = 'light';

function applyTheme(theme) {
  currentTheme = theme;
  document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : '');
  document.getElementById('themeToggle').textContent = theme === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('forex_theme', theme);
}

function toggleTheme() {
  applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
}

// ============================================
// RESET
// ============================================
function confirmReset() {
  if (!confirm('⚠️ ล้างข้อมูลทั้งหมด รวมถึงรูปกราฟทุกอัน?\n\nกด OK เพื่อยืนยัน')) return;
  localStorage.removeItem('forex_action_plan');
  localStorage.removeItem('forex_action_plan_imgs');
  allData = {};
  chartImages = {};
  currentWeek = getThisWeekLabel();
  allData[currentWeek] = {};
  clearAllFields();
  showToast('🗑 Reset เรียบร้อยแล้ว');
}

function getThisWeekLabel() {
  const now = new Date();
  const day = now.getDay() || 7;
  const mon = new Date(now);
  mon.setDate(now.getDate() - day + 1);
  const fri = new Date(mon);
  fri.setDate(mon.getDate() + 4);
  const months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  return `${mon.getDate()}-${fri.getDate()} ${months[fri.getMonth()]} ${fri.getFullYear()}`;
}

// ============================================
// RENDER SYMBOLS
// ============================================
function renderSymbols() {
  const grid = document.getElementById('symbolsGrid');
  grid.innerHTML = SYMBOLS.map(sym => `
    <div class="sym-card ${sym.cls}" id="card_${sym.id}"
      ondragover="onCardDragOver(event,'${sym.id}')"
      ondragleave="onCardDragLeave(event,'${sym.id}')"
      ondrop="onCardDrop(event,'${sym.id}')">
      <div class="sym-header">
        <div style="display:flex;align-items:center;gap:8px">
          <span class="drag-handle" title="ลากเพื่อเรียงลำดับ"
            draggable="true"
            ondragstart="onCardDragStart(event,'${sym.id}')">⠿</span>
          <span class="sym-name">${sym.name}</span>
        </div>
        <div class="day-tabs" id="daytabs_${sym.id}" style="margin-bottom:0">
          ${['PLAN','MON','TUE','WED','THU','FRI'].map((d,i) =>
            `<button class="day-tab${i===0?' day-active':''}" id="daytab_${sym.id}_${d}" onclick="switchDay('${sym.id}','${d}',this)">${d}</button>`
          ).join('')}
        </div>
      </div>
      <div class="sym-body">

        <!-- DAILY CHART + NOTE SECTION -->
        <div class="chart-section" id="chart_section_${sym.id}">
          ${['PLAN','MON','TUE','WED','THU','FRI'].map((d,i) => `
          <div class="day-content" id="daycontent_${sym.id}_${d}" style="display:${i===0?'flex':'none'};flex-direction:column;gap:10px">
            <!-- Per-day fields -->
            <div style="display:grid;grid-template-columns:1fr 1fr 1.4fr 1fr;gap:10px">
              <div class="field-group">
                <label>Pattern</label>
                <select class="field-sm" id="${sym.id}_${d}_pattern" onchange="autoSave();updateSummary()">
                  <option value="">— เลือก —</option>
                  ${PATTERNS.map(p=>`<option value="${p}">${p}</option>`).join('')}
                </select>
              </div>
              <div class="field-group">
                <label>Strategy</label>
                <select class="field-sm" id="${sym.id}_${d}_strategy" onchange="autoSave();updateSummary()">
                  <option value="">— เลือก —</option>
                  ${STRATEGIES.map(s=>`<option value="${s}">${s}</option>`).join('')}
                </select>
              </div>
              <div class="field-group">
                <label>Bias</label>
                <div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:2px" id="biaswrap_${sym.id}_${d}">
                  ${BIASES.map(b=>`<button class="bias-pill" onclick="setBiasDay('${sym.id}','${d}','${b}',this)">${b}</button>`).join('')}
                </div>
              </div>
              <div class="field-group">
                <label>Risk / Note</label>
                <input class="field-sm" id="${sym.id}_${d}_risk" placeholder="False Break, ข่าว..." oninput="autoSave()">
              </div>
            </div>
            <!-- Chart + TF + Note -->
            <div style="display:grid;grid-template-columns:1.8fr 1fr;gap:10px;align-items:start">
              <div>
                <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
                  <span class="chart-section-label" style="margin-bottom:0">Chart</span>
                  <div class="tf-selector" id="tfselector_${sym.id}_${d}">
                    ${['Week','Day','H4','H1','M30','M15'].map(tf =>
                      `<button class="tf-pill" onclick="setTFDay('${sym.id}','${d}','${tf}',this)">${tf}</button>`
                    ).join('')}
                  </div>
                </div>
                <div class="chart-dropzone" id="dropzone_${sym.id}_${d}"
                  ondragover="onDragOver(event,'${sym.id}','${d}')"
                  ondragleave="onDragLeave(event,'${sym.id}','${d}')"
                  ondrop="onDrop(event,'${sym.id}','${d}')">
                  <input type="file" accept="image/*" onchange="onFileSelect(event,'${sym.id}','${d}')">
                  <div class="chart-dropzone-icon">🖼</div>
                  <div class="chart-dropzone-text">คลิกเลือกรูป หรือลากมาวาง</div>
                  <div class="chart-dropzone-hint">Ctrl+V วาง Chart ได้ทันที</div>
                </div>
                <div class="chart-img-wrap" id="imgwrap_${sym.id}_${d}">
                  <img id="chartimg_${sym.id}_${d}" src="" alt="Chart ${d}" onclick="openChartFullscreen('${sym.id}','${d}')" title="คลิกดูเต็มจอ">
                  <div class="chart-img-actions">
                    <button class="chart-img-btn" onclick="openChartFullscreen('${sym.id}','${d}')">🔍 เต็มจอ</button>
                    <button class="chart-img-btn danger" onclick="removeChartImage('${sym.id}','${d}')">🗑 ลบ</button>
                    <span class="chart-paste-hint">Ctrl+V แปะใหม่</span>
                  </div>
                </div>
              </div>
              <div style="display:flex;flex-direction:column;gap:6px">
                <div class="field-group" style="margin-bottom:0"><label>${d} — Note</label></div>
                <textarea class="day-note" id="daynote_${sym.id}_${d}" placeholder="${d==='PLAN'?'วางแผนประจำสัปดาห์ Key level, Setup ที่รอ...':'Key level, Setup, สิ่งที่สังเกต...'}" oninput="autoSave()" style="min-height:160px;flex:1"></textarea>
              </div>
            </div>
          </div>
          `).join('')}
        </div>

        <div class="field-group">
          <label>Analysis / Note</label>
          <textarea class="note-field" id="${sym.id}_note" placeholder="วิเคราะห์เพิ่มเติม Key Level, Setup ที่รอ..." oninput="autoSave()"></textarea>
        </div>
      </div>
    </div>
  `).join('');
}

// ============================================
// CARD DRAG & DROP REORDER
// ============================================
let dragSrcId = null;

function onCardDragStart(e, symId) {
  dragSrcId = symId;
  e.dataTransfer.effectAllowed = 'move';
  setTimeout(() => document.getElementById(`card_${symId}`).classList.add('dragging'), 0);
}

function onCardDragOver(e, symId) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  if (symId !== dragSrcId) {
    document.querySelectorAll('.sym-card').forEach(c => c.classList.remove('drag-over'));
    document.getElementById(`card_${symId}`).classList.add('drag-over');
  }
}

function onCardDragLeave(e, symId) {
  document.getElementById(`card_${symId}`).classList.remove('drag-over');
}

function onCardDrop(e, symId) {
  e.preventDefault();
  document.querySelectorAll('.sym-card').forEach(c => { c.classList.remove('dragging','drag-over'); });
  if (!dragSrcId || dragSrcId === symId) { dragSrcId = null; return; }

  const srcIdx = SYMBOLS.findIndex(s => s.id === dragSrcId);
  const dstIdx = SYMBOLS.findIndex(s => s.id === symId);
  if (srcIdx === -1 || dstIdx === -1) return;

  // reorder SYMBOLS array
  const [moved] = SYMBOLS.splice(srcIdx, 1);
  SYMBOLS.splice(dstIdx, 0, moved);

  // save order
  localStorage.setItem('forex_sym_order', JSON.stringify(SYMBOLS.map(s => s.id)));

  // re-render and reload
  renderSymbols();
  loadWeekData();
  dragSrcId = null;
}

document.addEventListener('dragend', () => {
  document.querySelectorAll('.sym-card').forEach(c => c.classList.remove('dragging','drag-over'));
});

// ============================================
// DAY TABS
// ============================================
const DAYS = ['PLAN','MON','TUE','WED','THU','FRI'];

function switchDay(symId, day, btn) {
  activeDayState[symId] = day;
  // save to localStorage
  const tabState = JSON.parse(localStorage.getItem('forex_active_tabs') || '{}');
  tabState[symId] = day;
  localStorage.setItem('forex_active_tabs', JSON.stringify(tabState));

  document.querySelectorAll(`#daytabs_${symId} .day-tab`).forEach(b => b.classList.remove('day-active'));
  btn.classList.add('day-active');
  DAYS.forEach(d => {
    const el = document.getElementById(`daycontent_${symId}_${d}`);
    if (!el) return;
    el.style.display = (d === day) ? 'flex' : 'none';
  });
}

// ============================================
// PER-DAY BIAS
// ============================================
// biasState now: biasState[symId][day] = 'LONG'|...
function setBiasDay(symId, day, bias, btn) {
  if (!biasState[symId]) biasState[symId] = {};
  biasState[symId][day] = bias;
  const wrap = document.getElementById(`biaswrap_${symId}_${day}`);
  wrap.querySelectorAll('.bias-pill').forEach(b => b.className = 'bias-pill');
  btn.className = `bias-pill selected-${bias}`;
  autoSave();
  updateSummary();
}

function restoreBiasDay(symId, day, bias) {
  if (!bias) return;
  if (!biasState[symId]) biasState[symId] = {};
  biasState[symId][day] = bias;
  const wrap = document.getElementById(`biaswrap_${symId}_${day}`);
  if (!wrap) return;
  wrap.querySelectorAll('.bias-pill').forEach(btn => {
    const b = btn.getAttribute('onclick').match(/'([^']+)',this\)/)?.[1];
    btn.className = b === bias ? `bias-pill selected-${bias}` : 'bias-pill';
  });
}

function updateDayTabDots(symId) {
  const weekImgs = chartImages[currentWeek] || {};
  DAYS.forEach(d => {
    const key = `${symId}__${d}`;
    const tab = document.getElementById(`daytab_${symId}_${d}`);
    if (tab) tab.classList.toggle('has-img', !!weekImgs[key]);
  });
}

// ============================================
// CHART IMAGE HANDLING
// ============================================
let focusedSymId = null;
let focusedDay = 'MON';

document.addEventListener('click', function(e) {
  const card = e.target.closest('.sym-card');
  if (card) {
    const m = card.id.match(/^card_(.+)$/);
    if (m) {
      focusedSymId = m[1];
      focusedDay = activeDayState[m[1]] || 'MON';
    }
  }
});

function handleGlobalPaste(e) {
  const items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  for (let i = 0; i < items.length; i++) {
    if (items[i].type.indexOf('image') !== -1) {
      const file = items[i].getAsFile();
      if (calFocused) { readCalFile(file); e.preventDefault(); return; }
      if (!focusedSymId) { showToast('⚠️ คลิกที่การ์ดก่อน แล้ว Ctrl+V'); return; }
      readImageFile(file, focusedSymId, focusedDay);
      e.preventDefault();
      return;
    }
  }
}

function onFileSelect(e, symId, day) {
  const file = e.target.files[0];
  if (file) readImageFile(file, symId, day);
}
function onDragOver(e, symId, day) {
  e.preventDefault();
  document.getElementById(`dropzone_${symId}_${day}`).classList.add('dragover');
}
function onDragLeave(e, symId, day) {
  document.getElementById(`dropzone_${symId}_${day}`).classList.remove('dragover');
}
function onDrop(e, symId, day) {
  e.preventDefault();
  document.getElementById(`dropzone_${symId}_${day}`).classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) readImageFile(file, symId, day);
}

function readImageFile(file, symId, day) {
  const reader = new FileReader();
  reader.onload = function(ev) {
    setChartImage(symId, day, ev.target.result);
    autoSave();
    showToast('🖼 บันทึกรูปแล้ว');
  };
  reader.readAsDataURL(file);
}

function setChartImage(symId, day, base64) {
  if (!chartImages[currentWeek]) chartImages[currentWeek] = {};
  const key = `${symId}__${day}`;
  chartImages[currentWeek][key] = base64;

  document.getElementById(`chartimg_${symId}_${day}`).src = base64;
  document.getElementById(`imgwrap_${symId}_${day}`).classList.add('show');
  document.getElementById(`dropzone_${symId}_${day}`).style.display = 'none';

  updateDayTabDots(symId);
  saveImages();
}

function removeChartImage(symId, day) {
  if (!confirm('ลบรูปนี้?')) return;
  const key = `${symId}__${day}`;
  if (chartImages[currentWeek]) delete chartImages[currentWeek][key];

  document.getElementById(`chartimg_${symId}_${day}`).src = '';
  document.getElementById(`imgwrap_${symId}_${day}`).classList.remove('show');
  document.getElementById(`dropzone_${symId}_${day}`).style.display = '';

  updateDayTabDots(symId);
  saveImages();
  showToast('🗑 ลบรูปแล้ว');
}

function openChartFullscreen(symId, day) {
  const src = document.getElementById(`chartimg_${symId}_${day}`).src;
  if (!src) return;
  const win = window.open('', '_blank');
  win.document.write(`<html><body style="margin:0;background:#000;display:flex;align-items:center;justify-content:center;min-height:100vh"><img src="${src}" style="max-width:100%;max-height:100vh;object-fit:contain"></body></html>`);
}

function saveImages() {
  try {
    localStorage.setItem('forex_action_plan_imgs', JSON.stringify(chartImages));
  } catch(e) {
    showToast('⚠️ พื้นที่เก็บข้อมูลเต็ม');
  }
}

function loadChartImages() {
  const weekImgs = chartImages[currentWeek] || {};
  SYMBOLS.forEach(sym => {
    DAYS.forEach(d => {
      const key = `${sym.id}__${d}`;
      const base64 = weekImgs[key];
      const img = document.getElementById(`chartimg_${sym.id}_${d}`);
      const wrap = document.getElementById(`imgwrap_${sym.id}_${d}`);
      const dropzone = document.getElementById(`dropzone_${sym.id}_${d}`);
      if (!img) return;
      if (base64) {
        img.src = base64;
        wrap.classList.add('show');
        dropzone.style.display = 'none';
      } else {
        img.src = '';
        wrap.classList.remove('show');
        dropzone.style.display = '';
      }
    });
    updateDayTabDots(sym.id);
  });
}

// ============================================
// ECONOMIC CALENDAR IMAGE
// ============================================
let calFocused = false;

document.addEventListener('click', function(e) {
  calFocused = !!e.target.closest('#cal_dropzone, #cal_img_wrap');
});

function onCalDragOver(e) { e.preventDefault(); document.getElementById('cal_dropzone').classList.add('dragover'); }
function onCalDragLeave(e) { document.getElementById('cal_dropzone').classList.remove('dragover'); }
function onCalDrop(e) {
  e.preventDefault();
  document.getElementById('cal_dropzone').classList.remove('dragover');
  const file = e.dataTransfer.files[0];
  if (file && file.type.startsWith('image/')) readCalFile(file);
}
function onCalFileSelect(e) {
  const file = e.target.files[0];
  if (file) readCalFile(file);
}
function readCalFile(file) {
  const reader = new FileReader();
  reader.onload = function(ev) { setCalImage(ev.target.result); autoSave(); showToast('📅 บันทึก Calendar แล้ว'); };
  reader.readAsDataURL(file);
}
function setCalImage(base64) {
  if (!chartImages[currentWeek]) chartImages[currentWeek] = {};
  chartImages[currentWeek]['__cal__'] = base64;
  document.getElementById('cal_img').src = base64;
  document.getElementById('cal_img_wrap').classList.add('show');
  document.getElementById('cal_dropzone').style.display = 'none';
  saveImages();
}
function removeCalImage() {
  if (!confirm('ลบรูป Calendar?')) return;
  if (chartImages[currentWeek]) delete chartImages[currentWeek]['__cal__'];
  document.getElementById('cal_img').src = '';
  document.getElementById('cal_img_wrap').classList.remove('show');
  document.getElementById('cal_dropzone').style.display = '';
  saveImages();
  showToast('🗑 ลบ Calendar แล้ว');
}
function openCalFullscreen() {
  const src = document.getElementById('cal_img').src;
  if (!src) return;
  const win = window.open('', '_blank');
  win.document.write(`<html><body style="margin:0;background:#111;display:flex;align-items:center;justify-content:center;min-height:100vh"><img src="${src}" style="max-width:100%;max-height:100vh;object-fit:contain"></body></html>`);
}
function loadCalImage() {
  const base64 = (chartImages[currentWeek] || {})['__cal__'];
  if (base64) {
    document.getElementById('cal_img').src = base64;
    document.getElementById('cal_img_wrap').classList.add('show');
    document.getElementById('cal_dropzone').style.display = 'none';
  } else {
    document.getElementById('cal_img').src = '';
    document.getElementById('cal_img_wrap').classList.remove('show');
    document.getElementById('cal_dropzone').style.display = '';
  }
}

// ============================================
// TIMEFRAME (per-day)
// ============================================
function setTFDay(symId, day, tf, btn) {
  const container = document.getElementById(`tfselector_${symId}_${day}`);
  container.querySelectorAll('.tf-pill').forEach(b => b.classList.remove('tf-active'));
  btn.classList.add('tf-active');
  tfState[`${symId}__${day}`] = tf;
  autoSave();
}

function restoreTFDay(symId, day, tf) {
  if (!tf) return;
  tfState[`${symId}__${day}`] = tf;
  const container = document.getElementById(`tfselector_${symId}_${day}`);
  if (!container) return;
  container.querySelectorAll('.tf-pill').forEach(b => {
    b.classList.toggle('tf-active', b.textContent === tf);
  });
}

// ============================================
// BIAS
// ============================================
function setBias(id, bias, btn) {
  const parent = btn.parentNode;
  parent.querySelectorAll('.bias-pill').forEach(b => { b.className = 'bias-pill'; });
  btn.className = `bias-pill selected-${bias}`;
  biasState[id] = bias;
  autoSave();
  updateSummary();
  if (id === 'dxy') {
    const el = document.getElementById('dxy_bias_display');
    el.innerHTML = `<span class="bias-display bias-${bias}">${bias}</span>`;
  }
}

function restoreBias(id, bias) {
  if (!bias) return;
  biasState[id] = bias;
  const allPills = document.querySelectorAll(`[onclick*="setBias('${id}'"]`);
  allPills.forEach(btn => {
    const b = btn.getAttribute('onclick').match(/,'(\w+)'/)?.[1];
    if (b === bias) {
      btn.className = `bias-pill selected-${bias}`;
      if (id === 'dxy') {
        document.getElementById('dxy_bias_display').innerHTML = `<span class="bias-display bias-${bias}">${bias}</span>`;
      }
    } else {
      btn.className = 'bias-pill';
    }
  });
}

// ============================================
// LOAD / SAVE
// ============================================
function loadWeekData() {
  const data = allData[currentWeek] || {};
  biasState = {};
  activeDayState = {};

  setVal('ov_week', data.ov_week || '');
  setVal('ov_risk', data.ov_risk || '');
  setVal('ov_analysis', data.ov_analysis || '');
  setVal('ov_summary', data.ov_summary || '');

  if (data.dxy_bias) restoreBias('dxy', data.dxy_bias);

  // restore saved active tabs
  const savedTabs = JSON.parse(localStorage.getItem('forex_active_tabs') || '{}');

  SYMBOLS.forEach(sym => {
    const d = data[sym.id] || {};

    // restore per-day fields
    DAYS.forEach(day => {
      const dd = (d.days || {})[day] || {};
      setVal(`${sym.id}_${day}_pattern`, dd.pattern || '');
      setVal(`${sym.id}_${day}_strategy`, dd.strategy || '');
      setVal(`${sym.id}_${day}_risk`, dd.risk || '');
      setVal(`daynote_${sym.id}_${day}`, dd.note || '');
      if (dd.bias) restoreBiasDay(sym.id, day, dd.bias);
      if (dd.tf) restoreTFDay(sym.id, day, dd.tf);
    });

    // restore active tab (last used, default PLAN)
    const activeDay = savedTabs[sym.id] || 'PLAN';
    activeDayState[sym.id] = activeDay;
    DAYS.forEach(day => {
      const tab = document.getElementById(`daytab_${sym.id}_${day}`);
      const content = document.getElementById(`daycontent_${sym.id}_${day}`);
      if (tab) tab.classList.toggle('day-active', day === activeDay);
      if (content) content.style.display = (day === activeDay) ? 'flex' : 'none';
    });
  });

  loadChartImages();
  loadCalImage();
  updateSummary();
}

function clearAllFields() {
  setVal('ov_week', '');
  setVal('ov_risk', '');
  setVal('ov_analysis', '');
  setVal('ov_summary', '');

  document.querySelectorAll('.bias-pill').forEach(b => b.className = 'bias-pill');
  document.querySelectorAll('.tf-pill').forEach(b => b.classList.remove('tf-active'));
  document.getElementById('dxy_bias_display').innerHTML = '';
  biasState = {};
  tfState = {};
  activeDayState = {};

  document.getElementById('cal_img').src = '';
  document.getElementById('cal_img_wrap').classList.remove('show');
  document.getElementById('cal_dropzone').style.display = '';

  SYMBOLS.forEach(sym => {
    DAYS.forEach((day, i) => {
      setVal(`${sym.id}_${day}_pattern`, '');
      setVal(`${sym.id}_${day}_strategy`, '');
      setVal(`${sym.id}_${day}_risk`, '');
      setVal(`daynote_${sym.id}_${day}`, '');
      const bwrap = document.getElementById(`biaswrap_${sym.id}_${day}`);
      if (bwrap) bwrap.querySelectorAll('.bias-pill').forEach(b => b.className = 'bias-pill');
      const tfselector = document.getElementById(`tfselector_${sym.id}_${day}`);
      if (tfselector) tfselector.querySelectorAll('.tf-pill').forEach(b => b.classList.remove('tf-active'));
      const img = document.getElementById(`chartimg_${sym.id}_${day}`);
      const wrap = document.getElementById(`imgwrap_${sym.id}_${day}`);
      const dropzone = document.getElementById(`dropzone_${sym.id}_${day}`);
      if (img) img.src = '';
      if (wrap) wrap.classList.remove('show');
      if (dropzone) dropzone.style.display = '';
      const tab = document.getElementById(`daytab_${sym.id}_${day}`);
      const content = document.getElementById(`daycontent_${sym.id}_${day}`);
      if (tab) { tab.classList.remove('day-active','has-img'); if(i===0) tab.classList.add('day-active'); }
      if (content) content.style.display = (i === 0) ? 'flex' : 'none';
    });
  });
  localStorage.removeItem('forex_active_tabs');
  updateSummary();
}

function collectData() {
  const data = {
    ov_week: getVal('ov_week'),
    ov_risk: getVal('ov_risk'),
    ov_analysis: getVal('ov_analysis'),
    ov_summary: getVal('ov_summary'),
    dxy_bias: biasState['dxy'] || '',
  };
  SYMBOLS.forEach(sym => {
    const days = {};
    DAYS.forEach(d => {
      days[d] = {
        pattern:  getVal(`${sym.id}_${d}_pattern`),
        strategy: getVal(`${sym.id}_${d}_strategy`),
        bias:     (biasState[sym.id] || {})[d] || '',
        risk:     getVal(`${sym.id}_${d}_risk`),
        note:     getVal(`daynote_${sym.id}_${d}`),
        tf:       tfState[`${sym.id}__${d}`] || '',
      };
    });
    data[sym.id] = { days };
  });
  return data;
}

function saveData() {
  allData[currentWeek] = collectData();
  localStorage.setItem('forex_action_plan', JSON.stringify(allData));
  showToast('💾 บันทึกแล้ว');
}

function autoSave() {
  clearTimeout(autoSaveTimer);
  autoSaveTimer = setTimeout(() => {
    allData[currentWeek] = collectData();
    localStorage.setItem('forex_action_plan', JSON.stringify(allData));
  }, 800);
}

// ============================================
// SUMMARY
// ============================================
function updateSummary() {
  const grid = document.getElementById('summaryGrid');
  grid.innerHTML = SYMBOLS.map(sym => {
    const activeDay = activeDayState[sym.id] || 'PLAN';
    const bias = ((biasState[sym.id] || {})[activeDay]) || '—';
    const pattern = getVal(`${sym.id}_${activeDay}_pattern`) || '—';
    const strategy = getVal(`${sym.id}_${activeDay}_strategy`) || '—';
    const biasCls = bias !== '—' ? `bias-${bias}` : '';
    return `<div class="summary-item">
      <span class="summary-sym ${sym.cls}" style="font-family:var(--font-display);font-size:15px;letter-spacing:.06em">${sym.name}</span>
      <span class="summary-bias ${biasCls}" style="font-family:var(--font-mono);font-size:11px;padding:1px 7px;border-radius:3px;width:fit-content;font-weight:600">${bias}</span>
      <span class="summary-strat">${strategy}</span>
      <span style="font-size:10px;color:var(--text3);font-family:var(--font-mono)">${pattern}</span>
    </div>`;
  }).join('');
}

// ============================================
// EXPORT
// ============================================
function exportData() {
  const data = collectData();
  let text = `ACTION PLAN — ${currentWeek}\n`;
  text += `${'='.repeat(50)}\n\n`;
  text += `WEEK: ${data.ov_week}\n`;
  text += `KEY RISK: ${data.ov_risk}\n`;
  text += `DXY BIAS: ${data.dxy_bias}\n`;
  text += `ANALYSIS: ${data.ov_analysis}\n\n`;
  SYMBOLS.forEach(sym => {
    text += `${sym.name}\n`;
    DAYS.forEach(day => {
      const d = (data[sym.id]?.days || {})[day] || {};
      const hasImg = (chartImages[currentWeek] || {})[`${sym.id}__${day}`] ? '[📷]' : '';
      if (d.pattern || d.strategy || d.bias || d.risk || d.note) {
        text += `  [${day}] ${hasImg} Pattern: ${d.pattern||'—'} | Strategy: ${d.strategy||'—'} | Bias: ${d.bias||'—'}\n`;
        if (d.risk) text += `         Risk: ${d.risk}\n`;
        if (d.note) text += `         Note: ${d.note}\n`;
      }
    });
    text += '\n';
  });
  text += `SUMMARY: ${data.ov_summary}`;
  const blob = new Blob([text], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `ActionPlan_${currentWeek.replace(/\s/g,'_')}.txt`;
  a.click();
  showToast('📋 Export สำเร็จ');
}

// ============================================
// HELPERS
// ============================================
function setVal(id, val) {
  const el = document.getElementById(id);
  if (!el) return;
  el.value = val;
}
function getVal(id) {
  const el = document.getElementById(id);
  return el ? el.value.trim() : '';
}

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}
</script>
